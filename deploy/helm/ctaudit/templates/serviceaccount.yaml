{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "ctaudit.serviceAccountName" . }}
  labels:
    {{- include "ctaudit.labels" . | nindent 4 }}
  annotations:
    eks.amazonaws.com/role-arn: {{ required "serviceAccount.roleArn is required when serviceAccount.create is true" .Values.serviceAccount.roleArn | quote }}
automountServiceAccountToken: false
{{- end }}
